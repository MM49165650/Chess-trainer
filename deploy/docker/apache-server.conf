# Server-wide Apache settings for the production image.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# At most 16 PHP processes at once, in place of Debian's 150. The server is
# shared with other sites, and the container's memory limit is in
# compose.production.yaml; see "Resource limits" in docs/deployment.md.
# Loaded after mods-enabled/mpm_prefork.conf, so these values win.
<IfModule mpm_prefork_module>
    ServerLimit         16
    MaxRequestWorkers   16
    StartServers        2
    MinSpareServers     2
    MaxSpareServers     4
</IfModule>
