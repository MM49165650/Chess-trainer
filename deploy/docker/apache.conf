# The app's one site. Hestia's nginx on the host terminates HTTPS and proxies
# every request here; see docs/deployment.md.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        # Anything that is not a file in public/ goes to Laravel.
        FallbackResource /index.php
    </Directory>

    # The built assets have a hash in their names, so they never change.
    <Directory /var/www/html/public/build>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
